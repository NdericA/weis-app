<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEIS | Driver Review Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v=20260329c">
</head>
<body>
    <div class="layout-shell auth-shell">
        <header class="site-header">
            <div class="brand-block">
                <div class="brand-mark">
                    <img src="/static/img/weis-logo.png" alt="WEIS logo">
                </div>
                <div>
                    <p class="kicker">WEIS Ride Platform</p>
                    <h1>Driver application review</h1>
                </div>
            </div>
            <div class="header-actions">
                <a href="/login" class="button button-light">Login</a>
                <button id="logout-button" type="button" class="button button-dark">Logout</button>
            </div>
        </header>

        <main class="auth-main">
            <section class="panel auth-form-panel">
                <div class="panel-header">
                    <div>
                        <p class="kicker">Application status</p>
                        <h3 id="driver-review-title">Review pending</h3>
                    </div>
                    <div id="driver-review-pill" class="status-chip warning">Pending</div>
                </div>

                <div class="review-status-card">
                    <span class="summary-label">Driver</span>
                    <strong id="driver-review-name">-</strong>
                    <p id="driver-review-copy" class="tip-status">Your application is waiting for admin review.</p>
                </div>

                <div id="driver-rejection-panel" class="review-status-card hidden">
                    <span class="summary-label">Rejection reason</span>
                    <strong id="driver-rejection-reason">-</strong>
                    <p id="driver-additional-copy" class="tip-status">If more details are required, provide them below.</p>
                </div>

                <form id="driver-additional-form" class="stack-form hidden">
                    <label>
                        Additional information
                        <textarea id="driver-additional-info" rows="5" placeholder="Provide more details about your documents, vehicle, or corrections."></textarea>
                    </label>
                    <div class="button-row left">
                        <button type="submit" class="button button-dark">Submit additional information</button>
                    </div>
                    <p id="driver-additional-status" class="tip-status">This update will be visible to the admin dashboard.</p>
                </form>
            </section>
        </main>
    </div>
    <script src="/static/js/auth.js?v=20260329c"></script>
</body>
</html>
